<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Curly Runs Home</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Curly Home">
<meta name="theme-color" content="#3a4766">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b3550;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100vw;height:100vh}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#2e3a58,#56688c 60%,#4f8a3c 60%,#3f7330);font-family:"Chalkboard SE","Comic Sans MS",system-ui,sans-serif;z-index:5}
  #start h1{font-size:9vmin;margin:0 0 2vmin;color:#fff3c4;text-align:center;text-shadow:0 .6vmin 0 #1d2438}
  #start .big{font-size:20vmin;line-height:1}
  #play{margin-top:4vmin;font-size:9vmin;padding:2vmin 9vmin;border:none;border-radius:7vmin;background:#ffcc33;color:#5a3a00;box-shadow:0 1.2vmin 0 #c99400;font-family:inherit}
  #play:active{transform:translateY(1vmin);box-shadow:0 .2vmin 0 #c99400}
</style>
</head>
<body>
<div id="start">
  <div class="big">🌪️🐶🏠</div>
  <h1>Curly Runs Home</h1>
  <button id="play">▶ Play</button>
</div>
<canvas id="c"></canvas>
<script>
"use strict";
// ================= settings =================
const Q = new URLSearchParams(location.search);
const FAST = Q.has("fast");                 // ?fast=1 makes the run short for testing
const ICON = Q.has("icon");                 // ?icon=1 draws the app icon
const RUN_SECONDS = FAST ? 18 : 75;         // how long the outside run lasts (about)
const SPEED = 240;                          // Curly's running speed (px/s)
const HOUSE_X = SPEED * RUN_SECONDS;        // where the house door is
const JUMP_V = 1100, GRAV = 1900;           // big floaty hop (~1.15 s in the air)
const DASH_TIME = 1.2, DASH_COOL = 1.4, DASH_MULT = 1.7;
const W = 1024, H = 768, GROUND = 600, CURLY_SX = 240;

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  if (ICON) { cv.width = 512; cv.height = 512; cv.style.width = "512px"; cv.style.height = "512px"; return; }
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  scale = Math.min(innerWidth / W, innerHeight / H);
  offX = (innerWidth - W * scale) / 2; offY = (innerHeight - H * scale) / 2;
}
addEventListener("resize", resize); resize();
const worldT = () => ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);

// seeded random so the run is the same every time
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;

// ================= sound =================
let ac = null, master = null, noiseBuf = null, rainGain = null, windGain = null;
function initAudio() {
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const loop = (type, freq, vol) => {
      const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
      const g = ac.createGain(); g.gain.value = vol; s.connect(f).connect(g).connect(master); s.start(); return g;
    };
    rainGain = loop("bandpass", 1400, 0.05);
    windGain = loop("lowpass", 260, 0.12);
  } catch (e) { ac = null; }
}
function ambience(rain, wind) {
  if (!ac) return;
  rainGain.gain.setTargetAtTime(rain, ac.currentTime, 0.4); windGain.gain.setTargetAtTime(wind, ac.currentTime, 0.4);
}
function tone(freq, dur, type = "sine", vol = 0.25, slide = 0, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + Math.max(0, delay), o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, freq, vol, type = "lowpass", delay = 0, attack = 0.01) {
  if (!ac) return;
  const t = ac.currentTime + delay, s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
}
const sfx = {
  jump: () => tone(380, 0.22, "sine", 0.22, 420),
  land: () => tone(140, 0.08, "sine", 0.12),
  bonk: () => { tone(520, 0.12, "square", 0.08, -300); tone(300, 0.5, "sine", 0.25, 300, 0.08); tone(600, 0.4, "sine", 0.12, -350, 0.3); },
  yelp: () => { tone(900, 0.1, "sawtooth", 0.06, 300); },
  woof: () => { tone(420, 0.12, "sawtooth", 0.12, -200); tone(380, 0.12, "sawtooth", 0.12, -180, 0.18); },
  creak: () => { tone(160, 0.6, "sawtooth", 0.05, 90); tone(120, 0.5, "sawtooth", 0.04, 60, 0.3); },
  crash: () => { noise(0.5, 500, 0.35); tone(90, 0.35, "sine", 0.3, -40); },
  clang: () => { tone(700, 0.4, "triangle", 0.18, -200); tone(1050, 0.3, "triangle", 0.1, 0, 0.05); },
  tick: () => { tone(1800 + Math.random() * 900, 0.05, "square", 0.03); },
  warn: () => { tone(880, 0.12, "triangle", 0.12); tone(660, 0.16, "triangle", 0.12, 0, 0.14); },
  sparkle: () => { [1047, 1319, 1568].forEach((f, i) => tone(f, 0.18, "sine", 0.1, 0, i * 0.06)); },
  dash: () => { noise(0.4, 2200, 0.12, "bandpass"); tone(300, 0.3, "triangle", 0.1, 500); },
  thunder: (muffled) => { noise(2.2, muffled ? 150 : 320, muffled ? 0.3 : 0.7, "lowpass", 0.35, 0.06); noise(1.4, muffled ? 120 : 200, muffled ? 0.25 : 0.5, "lowpass", 0.75, 0.1); },
  door: () => { tone(110, 0.25, "sine", 0.4, -40); noise(0.2, 400, 0.3); },
  squeak: () => { tone(1200, 0.12, "sine", 0.2, 500); tone(1500, 0.1, "sine", 0.18, -400, 0.13); },
  nom: () => { tone(220, 0.08, "square", 0.08); tone(180, 0.08, "square", 0.08, 0, 0.1); tone(240, 0.08, "square", 0.08, 0, 0.2); },
  boing: () => tone(260, 0.5, "sine", 0.25, 500),
  kiss: () => { tone(1400, 0.06, "sine", 0.15, -700); },
  yay: () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.25, "triangle", 0.2, 0, i * 0.12)); },
  step: () => tone(150, 0.04, "sine", 0.04),
};
// little background songs (quiet): bouncy & brave outside, lullaby inside
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const SONGS = {
  run: { step: 0.19, bass: [48, 0, 55, 0, 57, 0, 55, 0, 53, 0, 60, 0, 55, 0, 52, 0], mel: [72, 0, 74, 76, 79, 0, 76, 74, 72, 0, 76, 0, 74, 0, 0, 0, 72, 0, 74, 76, 79, 0, 81, 79, 76, 0, 74, 0, 72, 0, 0, 0], bv: 0.07, mv: 0.035 },
  home: { step: 0.36, bass: [48, 0, 0, 55, 0, 0, 53, 0, 0, 55, 0, 0], mel: [76, 0, 79, 84, 0, 79, 77, 0, 74, 72, 0, 0, 76, 0, 79, 81, 0, 79, 76, 0, 74, 72, 0, 0], bv: 0.05, mv: 0.04 },
};
let song = null, songStep = 0, nextNote = 0;
function playSong(name) { song = name ? SONGS[name] : null; songStep = 0; if (ac) nextNote = ac.currentTime + 0.1; }
function musicTick() {
  if (!ac || !song) return;
  while (nextNote < ac.currentTime + 0.15) {
    const d = nextNote - ac.currentTime, b = song.bass[songStep % song.bass.length], m = song.mel[songStep % song.mel.length];
    if (b) tone(mtof(b), song.step * 1.6, "triangle", song.bv, 0, d);
    if (m) tone(mtof(m), song.step * 1.4, song === SONGS.home ? "sine" : "triangle", song.mv, 0, d);
    nextNote += song.step; songStep++;
  }
}

// ================= voice =================
let message = "", lastSay = "", msgT = 0;
function say(text, opt = {}) {
  lastSay = text; message = text; msgT = 0; window.__said && window.__said.push(text);
  try {
    if (opt.soft && speechSynthesis.speaking) return;     // nice-to-have lines don't interrupt
    if (!opt.queue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[^\w\s!?,.']/g, ""));
    u.lang = "en-US"; u.rate = 0.9; u.pitch = 1.25;
    const v = speechSynthesis.getVoices().find(v => /Samantha|Karen|Moira|Tessa|Google US English/.test(v.name));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
window.__said = [];
const saidOnce = new Set();
const sayOnce = (k, text, opt) => { if (!saidOnce.has(k)) { saidOnce.add(k); say(text, opt); return true; } return false; };

// ================= game state =================
let state = "start";          // run -> enter -> house -> finale
let time = 0, runT = 0, fade = 0, fadeDir = 0, fadeCb = null;
let camX = 0, hazards = [], particles = [], hits = 0, jumps = 0, cleared = 0;
let flash = 0, nextBolt = 3, bolt = null, tornX = 70;
let doorClose = 0, enterT = 0;
let room = 0, camHX = 0, roomSeen = [false, false, false], finT = 0, playAgain = false;
let toyBounce = 0, pineWiggle = 0;
const curly = { wx: 0, h: 0, vy: 0, air: false, v: SPEED, walk: 0, wag: 0, dizzy: 0, spin: 0, dashT: 0, dashCool: 0, hx: 0, htx: 0, dir: 1, hide: false };
const drops = Array.from({ length: 140 }, (_, i) => ({ x: hash(i) * 1300, y: hash(i + 99) * 768, s: 0.7 + hash(i + 7) * 0.6 }));
const leaves = Array.from({ length: 16 }, (_, i) => ({ x: hash(i + 300) * 1100, y: 200 + hash(i + 400) * 380, r: hash(i + 500) * 6, c: ["#e2a33a", "#c9662e", "#8fbf3a", "#d9c23a"][i % 4], s: 0.6 + hash(i + 600) }));

function makeHazards() {
  const r = rng(7), list = [], types = ["sign", "tree", "hail"];
  let x = FAST ? 1400 : 1900, i = 0;
  const signs = ["stop", "yield", "street"];
  while (x < HOUSE_X - 1200) {
    const type = i < 3 ? types[i] : types[Math.floor(r() * 3)];
    list.push({ type, wx: x, phase: "wait", t: 0, fall: 0, hit: false, cleared: false, sign: signs[i % 3], hw: type === "hail" ? 52 : 75, hh: type === "hail" ? 34 : 46, stones: [], shake: 0 });
    x += FAST ? 700 : 1000 + r() * 400; i++;
  }
  return list;
}

function resetGame() {
  state = "run"; time = 0; runT = 0; camX = 0; hits = 0; jumps = 0; cleared = 0; particles = [];
  Object.assign(curly, { wx: 0, h: 0, vy: 0, air: false, v: SPEED, dizzy: 0, spin: 0, dashT: 0, dashCool: 0, hide: false, dir: 1 });
  hazards = makeHazards(); flash = 0; nextBolt = 2.5; bolt = null; doorClose = 0; enterT = 0;
  room = 0; camHX = 0; roomSeen = [false, false, false]; finT = 0; playAgain = false; saidOnce.clear();
  ambience(0.05, 0.12); playSong("run");
  say("Run, Curly, run! Get to the house!"); say("Tap to jump!", { queue: true }); saidOnce.add("tap");
}

// ================= input =================
const toWorld = e => ({ x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale });
const near = (p, x, y, r) => Math.hypot(p.x - x, p.y - y) < r;
const BTN = { jump: [110, 650, 85], dash: [W - 110, 650, 85], speaker: [W - 56, 56, 42] };
function jump() {
  if (state !== "run" || curly.air) return;
  curly.air = true; curly.vy = -JUMP_V; jumps++; sfx.jump();
  if (jumps === 1) sayOnce("jump1", "Yay! Good jump!", { soft: true });
}
function dash() {
  if (state !== "run" || curly.dashCool > 0) return;
  curly.dashT = DASH_TIME; curly.dashCool = DASH_TIME + DASH_COOL; sfx.dash(); sayOnce("dash", "Zoom! Super fast!", { soft: true });
}
function goRoom(r) {
  if (r < 0 || r > 2 || state !== "house") return;
  room = r; curly.htx = r * W + [430, 430, 330][r]; sfx.step();
}
function tap(p) {
  if (near(p, ...BTN.speaker)) { say(lastSay || message); return; }
  if (state === "run") { if (near(p, ...BTN.dash)) dash(); else jump(); return; }
  if (state === "house") {
    const ox = room * W - camHX;
    if (room > 0 && p.x < 170 && p.y > 250 && p.y < 560) { goRoom(room - 1); return; }
    if (Math.abs(curly.hx - curly.htx) > 30) return;            // still walking
    if (room === 0 && near(p, ox + 660, 410, 90)) { pineWiggle = 1; sfx.nom(); say("Yum! A pineapple! But no lady here."); burst(ox + 660, 400, 10); return; }
    if (room === 1 && near(p, ox + 720, 540, 90)) { toyBounce = 1; sfx.squeak(); say("Squeak squeak! A toy! But no lady here."); return; }
    if (room < 2) { goRoom(room + 1); return; }
    startFinale(); return;
  }
  if (state === "finale" && playAgain && near(p, 300, 430, 170)) { sfx.woof(); fadeTo(() => resetGame()); }
}
cv.addEventListener("pointerdown", e => { e.preventDefault(); if (state !== "start" && fadeDir === 0) tap(toWorld(e)); });
addEventListener("keydown", e => {
  if (state === "start" || e.repeat) return;
  const k = e.key;
  if (state === "run") { if (k === " " || k === "ArrowUp" || k === "w") jump(); if (k === "ArrowRight" || k === "Shift" || k === "d") dash(); }
  else if (state === "house") { if (k === "ArrowRight") goRoom(room + 1); if (k === "ArrowLeft") goRoom(room - 1); if ((k === " " || k === "Enter") && room === 2) startFinale(); }
  else if (state === "finale" && playAgain && (k === " " || k === "Enter")) fadeTo(() => resetGame());
});
function fadeTo(cb) { fadeDir = 1; fadeCb = cb; }

// ================= particles =================
function burst(x, y, n = 18, colors = ["#ffd23f", "#ff6b9a", "#5ad1ff", "#7be06b", "#ffffff"], world = false) {
  for (let i = 0; i < n && particles.length < 220; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 520, vy: -Math.random() * 520 - 100, life: 1.2 + Math.random() * 0.6, c: colors[i % colors.length], r: 5 + Math.random() * 6, g: 900, world });
}
function puff(x, y, n = 10, c = "rgba(180,170,150,0.7)") {
  for (let i = 0; i < n && particles.length < 220; i++) particles.push({ x: x + (Math.random() - 0.5) * 80, y: y - Math.random() * 20, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 90, life: 0.8 + Math.random() * 0.4, c, r: 12 + Math.random() * 12, g: -40, world: true, grow: 1 });
}
function floatEmoji(ch, x, y, world = false, size = 46) { particles.push({ x, y, vx: (Math.random() - 0.5) * 40, vy: -110, life: 1.6, emoji: ch, size, g: 0, world }); }

// ================= update =================
function update(dt) {
  time += dt; msgT += dt;
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; if (p.grow) p.r += 18 * dt; }
  particles = particles.filter(p => p.life > 0);
  // lightning (outside loud, inside muffled)
  nextBolt -= dt; flash = Math.max(0, flash - dt * 2.2);
  if (bolt) { bolt.t -= dt; if (bolt.t <= 0) bolt = null; }
  if (nextBolt <= 0 && (state === "run" || state === "enter" || state === "house")) {
    nextBolt = (state === "house" ? 6 : 4) + Math.random() * 4;
    const inside = state === "house";
    flash = inside ? 0.6 : 1; sfx.thunder(inside);
    const pts = []; let bx = 420 + Math.random() * 520, by = 40; pts.push([bx, by]);
    while (by < 330) { bx += (Math.random() - 0.5) * 70; by += 30 + Math.random() * 30; pts.push([bx, by]); }
    bolt = { pts, t: 0.22 };
    if (state === "run") sayOnce("bolt", "Whoa! Lightning! Curly is so brave!", { soft: true });
  }
  if (fadeDir) {
    fade += fadeDir * dt * 2.2;
    if (fade >= 1) { fade = 1; fadeDir = -1; const cb = fadeCb; fadeCb = null; cb && cb(); }
    if (fade <= 0) { fade = 0; fadeDir = 0; }
  }
  if (state === "run" || state === "enter") updateRun(dt);
  else if (state === "house") updateHouse(dt);
  else if (state === "finale") { updateHouse(dt); updateFinale(dt); }
}

function updateRun(dt) {
  runT += dt;
  const c = curly;
  c.dizzy = Math.max(0, c.dizzy - dt); c.dashT = Math.max(0, c.dashT - dt); c.dashCool = Math.max(0, c.dashCool - dt);
  c.spin = c.dizzy > 0 ? c.spin + dt * 11 : 0;
  c.wag += dt * 14;
  if (state === "run") {
    const tv = SPEED * (c.dashT > 0 ? DASH_MULT : 1) * (c.dizzy > 0 ? 0.45 : 1);
    c.v += (tv - c.v) * Math.min(1, dt * 5);
    c.wx += c.v * dt; c.walk += dt * c.v / 15;
    if (c.air) {
      c.vy += GRAV * dt; c.h -= c.vy * dt;
      if (c.h <= 0) { c.h = 0; c.air = false; c.vy = 0; sfx.land(); puff(c.wx, GROUND, 3, "rgba(150,130,100,0.5)"); }
    }
    if (c.wx >= HOUSE_X - 6) { c.wx = HOUSE_X; c.h = 0; c.air = false; state = "enter"; enterT = 0; c.hide = true; sfx.woof(); }
  }
  camX = Math.min(c.wx - CURLY_SX, HOUSE_X - 650);
  // tornado drifts behind (closer when Curly bonks, but it never catches him)
  const tTarget = (c.dizzy > 0 ? 140 : 70) + Math.sin(time * 1.3) * 22;
  tornX += (tTarget - tornX) * Math.min(1, dt * 1.5);
  // tutorial & encouragement
  if (state === "run") {
    if (runT > 2.6) sayOnce("tap", "Tap to jump!", { queue: true });
    if (runT > 9 && jumps === 0) sayOnce("tap2", "Tap anywhere to make Curly jump!");
    const prog = c.wx / HOUSE_X;
    if (prog > 0.5) sayOnce("half", "Halfway home! Keep running, Curly!", { soft: true });
    if (HOUSE_X - camX < W + 200) sayOnce("house", "There's the house! Almost there!");
  }
  // hazards
  for (const h of hazards) {
    const dist = h.wx - c.wx;
    h.shake = Math.max(0, h.shake - dt);
    if (h.phase === "wait" && dist < 860) {
      h.phase = "warn"; h.t = 0; sfx.warn();
      if (h.type === "tree") { sfx.creak(); sayOnce("tree", "Uh oh! A tree is falling! Get ready to jump!"); }
      if (h.type === "sign") sayOnce("sign", "Look out! The sign is falling! Jump over it!");
      if (h.type === "hail") sayOnce("hail", "Hail is coming! Jump over the ice!");
    }
    if (h.phase === "warn") { h.t += dt; if (dist < 600) { h.phase = "fall"; h.t = 0; if (h.type === "hail") makeHail(h); } }
    if (h.phase === "fall") {
      h.t += dt;
      if (h.type === "hail") {
        let all = true;
        for (const s of h.stones) { if (s.y < 0) { s.vy += 1400 * dt; s.y = Math.min(0, s.y + s.vy * dt); if (s.y >= 0) { sfx.tick(); } } if (s.y < 0) all = false; }
        if (all) { h.phase = "down"; puff(h.wx, GROUND, 5, "rgba(230,240,255,0.7)"); }
      } else {
        h.fall = Math.min(1, h.t / 0.7);
        if (h.fall >= 1) { h.phase = "down"; h.shake = 0.3; puff(h.wx, GROUND, 10); h.type === "tree" ? sfx.crash() : sfx.clang(); }
      }
    }
    // jump over it or bonk into it (forgiving hitbox)
    if (h.phase === "down" && !h.hit && !h.cleared) {
      const dx = Math.abs(c.wx + 5 - h.wx);
      if (dx < h.hw * 0.7 + 20 && c.h < h.hh) bonk(h);
      else if (c.wx - 40 > h.wx + h.hw * 0.7) { h.cleared = true; cleared++; sfx.sparkle(); floatEmoji("⭐", CURLY_SX + 20, GROUND - c.h - 170);
        if (cleared === 2) say("Great jump!", { soft: true }); if (cleared === 5) say("You're so good at jumping!", { soft: true }); }
    }
  }
  hazards = hazards.filter(h => h.wx - c.wx > -1400);
  // door
  if (state === "enter") {
    enterT += dt; doorClose = clamp((enterT - 0.35) / 0.4, 0, 1);
    if (enterT > 0.75 && !saidOnce.has("slam")) { saidOnce.add("slam"); sfx.door(); ambience(0.015, 0.03); playSong(null); say("You made it inside! Find the lady!"); }

  ctx.save(); ctx.translate(150, 300); ctx.scale(1.25, 1.25); drawCurly(0, 0, 1, { run: true, walk: 1, wag: 1, brave: true, tongue: true }); ctx.restore();
}

// ================= main loop =================
let lastT = performance.now(), frames = 0, fpsT = 0; window.__fps = 0;
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#1d2438"; ctx.fillRect(0, 0, cv.width, cv.height);
  worldT();
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (state === "house" || state === "finale") drawHouse(); else drawOutside();
  drawSpeakerAndMessage();
  if (fade > 0) { ctx.fillStyle = `rgba(20,16,30,${fade})`; ctx.fillRect(-10, -10, W + 20, H + 20); }
  ctx.restore();
}
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  frames++; fpsT += dt; if (fpsT >= 1) { window.__fps = frames / fpsT; frames = 0; fpsT = 0; }
  if (ICON) { drawIcon(); requestAnimationFrame(loop); return; }
  if (state !== "start") { update(dt); musicTick(); }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (ICON) document.getElementById("start").style.display = "none";
// drawn behind the start screen so it looks alive
hazards = makeHazards();

document.getElementById("play").addEventListener("click", () => {
  initAudio();
  try { speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); } catch (e) {}
  document.getElementById("start").style.display = "none";
  sfx.woof(); resetGame();
});
window.__g = () => ({ state, room, wx: Math.round(curly.wx), h: Math.round(curly.h), air: curly.air, hits, jumps, cleared, house: HOUSE_X, finT, playAgain, msg: message,
  next: hazards.filter(h => h.phase === "down" && !h.hit && !h.cleared).map(h => ({ type: h.type, dist: Math.round(h.wx - curly.wx) }))[0] || null });
if ("serviceWorker" in navigator && !ICON) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
